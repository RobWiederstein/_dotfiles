# ~/.config/starship.toml

# Sets the prompt format: hardcodes the user/host string since variables are blocked
# This guarantees 'rkw@bilbo' will always display.
format = "[rkw@bilbo]($style) $directory$git_branch$git_status$cmd_duration$line_break$character"

# Directory and Command Duration modules are correct
[directory]
truncation_length = 3
truncate_to_repo = true
format = "in [\\[$path\\](bold yellow)]($style)"

[cmd_duration]
min_time = 1000
format = "[$duration]($style) "

# Git status module is correct
[git_branch]
symbol = " " 
style = "bold green"
format = "on [$symbol$branch]($style)"

[git_status]
# 🎯 CORRECTED LINE: Removed escaped brackets \ and [ and ]
format = '([$all_status]($style))'
style = "bold red"
# Add missing status indicators for completeness (they were in your previous version)
stashed = 'stash'
ahead = '⇡${count}'
diverged = '⇕'
behind = '⇣${count}'
modified = 'M'
untracked = '?'
deleted = 'D'

# Final character is correct
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

