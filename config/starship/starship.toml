# ~/.config/starship.toml
# Goal: rkw (yellow) in 🌐 bilbo (yellow) in <path> (yellow) on  <branch> (status) <duration>

format = "$username$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
ssh_only = false
style = "bold yellow"
format = "in 🌐 [$hostname]($style) "

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold yellow"
format = "in [$path]($style) "

[cmd_duration]
min_time = 1000
format = "[$duration]($style) "

[git_branch]
symbol = " "
style = "bold green"
format = "on [$symbol$branch]($style)"

[git_status]
format = '([$all_status]($style))'
style = "bold red"
stashed = 'stash'
ahead = '⇡${count}'
diverged = '⇕'
behind = '⇣${count}'
modified = 'M'
untracked = '?'
deleted = 'D'

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
